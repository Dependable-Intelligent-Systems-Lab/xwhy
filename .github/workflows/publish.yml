name: Publish to PyPI and GitHub Releases

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    name: Build and attest distributions
    if: github.repository == 'Dependable-Intelligent-Systems-Lab/xwhy'
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: ./.github/workflows/generator-generic-ossf-slsa3-publish.yml
    with:
      run-checks: true

  pypi-publish:
    name: Publish and release verified build
    needs: build
    if: github.repository == 'Dependable-Intelligent-Systems-Lab/xwhy'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/xwhy/
    permissions:
      id-token: write
      contents: write
      actions: read
    steps:
      - name: Download package distributions
        uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist

      - name: Download signed provenance
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.provenance-name }}
          path: provenance

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/*
            provenance/*.intoto.jsonl
