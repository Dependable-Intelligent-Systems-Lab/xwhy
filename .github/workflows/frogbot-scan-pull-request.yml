name: Frogbot Scan Pull Request

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions: {}

jobs:
  scan-pull-request:
    # This also guards the environment request and every JFrog-specific step in forks.
    # The readiness switch prevents the irreversible first V3 scan before setup.
    if: >-
      github.repository == 'Dependable-Intelligent-Systems-Lab/xwhy' &&
      vars.JFROG_FROGBOT_V3_READY == 'true'
    runs-on: ubuntu-latest
    environment: frogbot
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      # pull_request_target executes the trusted upstream workflow. Only check out
      # the upstream base: never run contributor scripts with OIDC access.
      - name: Check out trusted base
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Scan proposed changes with Frogbot V3
        uses: jfrog/frogbot@98d710f28baab51f18800cdbbada700f245e9933 # v3.7.0
        with:
          version: '3.7.0'
          oidc-provider-name: ${{ vars.JFROG_OIDC_PROVIDER_NAME }}
          oidc-audience: https://github.com/Dependable-Intelligent-Systems-Lab
        env:
          JF_URL: ${{ vars.JF_URL }}
          JF_GIT_TOKEN: ${{ github.token }}
