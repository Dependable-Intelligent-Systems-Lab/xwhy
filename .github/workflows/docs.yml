name: Documentation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths:
      - "docs/**"
      - "src/**"
      - "scripts/**"
      - "properdocs.yml"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/docs.yml"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  workflow_run:
    workflows:
      - Publish to PyPI and GitHub Releases
    types:
      - completed

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-deploy:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install Dependencies
        run: uv sync --group dev

      - name: Inject Package Version
        run: uv run python scripts/inject_docs_version.py

      - name: Generate Contributors Page
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: uv run python scripts/generate_contributors.py

      - name: Generate Release Notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: uv run python scripts/generate_release_notes.py

      - name: Build Documentation
        run: uv run properdocs build --clean --site-dir site

      - name: Install Curated llms.txt
        run: cp docs/llms.txt site/llms.txt

      - name: Validate Critical Documentation Files
        run: |
          test -s site/index.html
          test -s site/llms.txt
          test -s site/reference/index.html
          test -s site/release-notes/index.html
          grep -q "XWhy: eXplain Why" site/llms.txt
          grep -q "getting-started/installation/" site/llms.txt
          grep -q "API Reference" site/reference/index.html
          grep -q "Release history" site/release-notes/index.html
          ! grep -q "index.md" site/llms.txt

      - name: Deploy Validated Documentation
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./site
          force_orphan: true
