name: Documentation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths:
      - "docs/**"
      - "src/**"
      - "scripts/**"
      - "properdocs.yml"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/docs.yml"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install Dependencies
        run: uv sync --group dev

      - name: Inject Package Version
        run: |
          VERSION="$(uv run python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          echo "Building documentation for XWhy v${VERSION}"
          sed -i "s/{{ XWHY_VERSION }}/${VERSION}/g" docs/index.md
          if grep -Fq "{{ XWHY_VERSION }}" docs/index.md; then
            echo "The documentation version placeholder was not replaced."
            exit 1
          fi

      - name: Generate Contributors Page
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: uv run python scripts/generate_contributors.py

      - name: Build Documentation
        run: uv run properdocs build --clean --site-dir site

      - name: Configure Git User
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Deploy Documentation
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: uv run properdocs gh-deploy --force
