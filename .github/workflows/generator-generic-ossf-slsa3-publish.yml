name: SLSA generic generator

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/generator-generic-ossf-slsa3-publish.yml
      - .github/workflows/publish.yml
  workflow_dispatch:
  workflow_call:
    inputs:
      run-checks:
        description: Run the release sanity checks before building distributions.
        type: boolean
        default: false
    outputs:
      provenance-name:
        description: The signed provenance artifact and file name.
        value: ${{ jobs.provenance.outputs.provenance-name }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      digests: ${{ steps.hash.outputs.digests }}
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12 3.13

      - name: Run Nox (Sanity Check before release)
        if: inputs.run-checks
        run: uv run nox

      - name: Build package distributions
        run: uv build

      - name: Generate subjects for provenance
        id: hash
        shell: bash
        run: |
          set -euo pipefail
          echo "digests=$(sha256sum dist/*.whl dist/*.tar.gz | base64 -w0)" >> "$GITHUB_OUTPUT"

      - name: Upload package distributions
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: python-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  provenance:
    needs: build
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.build.outputs.digests }}
