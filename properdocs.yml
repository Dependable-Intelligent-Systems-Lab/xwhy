site_name: XWhy Documentation
site_description: Model-agnostic explainability with XWhy and SMILE for image classification, image generation, LLMs, text, tabular, point-cloud, and future multimodal systems.
site_author: XWhy contributors
site_url: https://dependable-intelligent-systems-lab.github.io/xwhy/
repo_url: https://github.com/Dependable-Intelligent-Systems-Lab/xwhy
repo_name: Dependable-Intelligent-Systems-Lab/xwhy

copyright: Copyright &copy; XWhy contributors

theme:
  name: material
  features:
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

plugins:
  - search
  - mkdocs-jupyter
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
  - gen-files:
      scripts:
        - docs/gen_ref_pages.py
  - literate-nav:
      nav_file: SUMMARY.md
  - llmstxt:
      markdown_description: >-
        XWhy is a Python library for model-agnostic local explainability using
        SMILE. Image-classification and LLM explainers are currently available.
        Image-generation explainability and additional modalities are being
        developed and are explicitly labelled in the documentation.
      full_output: llms-full.txt
      sections:
        Getting Started:
          - index.md: XWhy overview and capability status
          - getting-started/installation.md: Installation and optional dependencies
          - getting-started/quick-start.md: First explanation workflow
          - getting-started/choosing-an-explainer.md: Select the correct explainer
        Explainers:
          - explainers/index.md: Supported and planned explainers
          - explainers/image/index.md: Image-classification explainability
          - explainers/image-generation/index.md: Planned image-generation explainability
          - explainers/image-generation/image-editing.md: Planned image-editing explainability
          - explainers/image-generation/pix2pix-models.md: Pix2Pix as an image-editing model example
          - explainers/llm/index.md: LLM prompt-response explainability
          - explainers/tabular.md: Tabular explainer development status
          - explainers/text.md: Text explainer development status
          - explainers/point-cloud.md: Point-cloud explainer development status
          - explainers/time-series.md: Planned time-series explainability
          - explainers/multimodal.md: Planned multimodal explainability
        Tutorials and Examples:
          - tutorials-and-examples/index.md: Directory of available and planned tutorials and examples
          - image_classification_explainer.md: Image-classification tutorial
          - llm_explainer.md: Unified LLM example with setup, executed outputs, and embedding comparison
          - examples/image.md: Planned image examples
          - examples/tabular.md: Planned tabular examples
          - examples/text.md: Planned text examples
          - examples/point-cloud.md: Planned point-cloud examples
        Concepts:
          - concepts/smile.md: How the SMILE explanation workflow operates
          - concepts/local-explanations.md: Scope of local explanations
          - concepts/limitations.md: Limitations and responsible interpretation
        Evaluation:
          - evaluation/index.md: Modality-aware explanation evaluation overview
          - evaluation/attribution-fidelity.md: ATT fidelity and implemented surrogate metrics
          - evaluation/attribution-accuracy.md: ATT accuracy and image coverage functions
          - evaluation/attribution-stability.md: ATT stability under small input changes
          - evaluation/attribution-consistency.md: ATT consistency across repeated executions
          - evaluation/attribution-faithfulness.md: ATT faithfulness under interventions
        Research:
          - research/index.md: Research and reproducibility entry point
          - research/citation.md: How to cite XWhy
        Contributors:
          - contributors.md: Contributors, maintainers, and contribution routes
          - contribute/contributing.md: Contribution guide
        API Reference:
          - reference/: Generated Python API reference

extra_css:
  - assets/stylesheets/extra.css

extra_javascript:
  - assets/javascripts/xwhy-nav.js
  - assets/javascripts/ai-links.js

extra:
  analytics:
    provider: google
    property: G-DV6YD3JCZ8

nav:
  - Home: index.md
  - Get Started:
      - Overview: getting-started/index.md
      - Installation: getting-started/installation.md
      - Quick Start: getting-started/quick-start.md
      - Choose an Explainer: getting-started/choosing-an-explainer.md
      - Explanation Results: getting-started/explanation-results.md
      - Visualisation: getting-started/visualisation.md
  - Explainers:
      - Overview: explainers/index.md
      - Image Classification: explainers/image/index.md
      - Image Generation:
          - Overview: explainers/image-generation/index.md
          - Image Editing: explainers/image-generation/image-editing.md
          - Pix2Pix Models: explainers/image-generation/pix2pix-models.md
      - LLM: explainers/llm/index.md
      - Tabular: explainers/tabular.md
      - Text: explainers/text.md
      - Point Cloud: explainers/point-cloud.md
      - Time Series: explainers/time-series.md
      - Multimodal: explainers/multimodal.md
  - Tutorials & Examples:
      - Overview: tutorials-and-examples/index.md
      - Image Classification Tutorial: image_classification_explainer.md
      - LLM Example: llm_explainer.md
      - Image Examples: examples/image.md
      - Tabular Examples: examples/tabular.md
      - Text Examples: examples/text.md
      - Point-Cloud Examples: examples/point-cloud.md
  - How-to Guides:
      - Overview: how-to/index.md
      - Configure Logging: how-to/logging.md
      - Connect Custom Models: how-to/custom-models.md
      - Configure LLM Providers: how-to/providers.md
      - Reproducible Explanations: how-to/reproducibility.md
  - Evaluation:
      - Overview: evaluation/index.md
      - ATT Fidelity: evaluation/attribution-fidelity.md
      - ATT Accuracy: evaluation/attribution-accuracy.md
      - ATT Stability: evaluation/attribution-stability.md
      - ATT Consistency: evaluation/attribution-consistency.md
      - ATT Faithfulness: evaluation/attribution-faithfulness.md
  - Research:
      - Overview: research/index.md
      - Publications: research/publications.md
      - Citation: research/citation.md
  - Contributors:
      - Overview: contributors.md
      - Contributing Guide: contribute/contributing.md

exclude_docs: |
  gen_ref_pages.py

not_in_nav: |
  concepts/index.md
  concepts/smile.md
  concepts/local-explanations.md
  concepts/limitations.md
  examples/index.md
  examples/llm-explainer.md
  reference/
  RELEASING.md