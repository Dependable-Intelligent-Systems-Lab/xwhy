version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.12"

  jobs:
    install:
      - python -m pip install --upgrade pip
      - python -m pip install -e .
      - python -m pip install "properdocs>=1.6.7"
      - python -m pip install "mkdocs-material>=9.7.6"
      - python -m pip install "mkdocstrings[python]>=1.0.5"
      - python -m pip install "mkdocs-jupyter>=0.26.3"
      - python -m pip install "mkdocs-gen-files>=0.6.1"
      - python -m pip install "mkdocs-literate-nav>=0.6.3"
      - python -m pip install "mkdocs-llmstxt>=0.2.0"
    build:
      html:
        - python scripts/inject_docs_version.py
        - python scripts/generate_contributors.py
        - python -m properdocs build --clean --site-dir $READTHEDOCS_OUTPUT/html
