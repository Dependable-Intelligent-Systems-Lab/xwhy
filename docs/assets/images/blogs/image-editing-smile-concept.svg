    <path d="m767 217 6-10h41l10 10" fill="#405d70" stroke="#d7e7ed" stroke-width="2"/>
    <path d="M754 218h78" stroke="#f1f8fc" stroke-width="3" stroke-linecap="round"/>
    <circle cx="765" cy="240" r="5" fill="#d1dee1"/><circle cx="824" cy="240" r="5" fill="#d1dee1"/>
    <path d="M919 191v44m0-31-16-20m16 20 16-26" stroke="#355b6e" stroke-width="5" fill="none" stroke-linecap="round"/>
    <circle cx="911" cy="177" r="17" fill="#b2ced9"/><circle cx="931" cy="170" r="20" fill="#bed5df"/>
    <path d="M699 173h35m24 0h15m27 0h22m22 0h22m27 0h20" stroke="#e8f4f8" stroke-width="3"/>
    <g fill="#f4fbff" opacity=".9"><circle cx="726" cy="127" r="2"/><circle cx="746" cy="157" r="2"/><circle cx="783" cy="108" r="2"/><circle cx="809" cy="155" r="2"/><circle cx="849" cy="130" r="2"/><circle cx="882" cy="158" r="2"/><circle cx="915" cy="109" r="2"/><circle cx="942" cy="151" r="2"/><circle cx="712" cy="182" r="2"/><circle cx="864" cy="111" r="2"/></g>
  </g>
  <rect x="699" y="103" width="252" height="146" rx="5" fill="none" stroke="#b9e5ff" stroke-opacity=".5"/>
  <text x="705" y="276" fill="#d6ecf7" font-family="system-ui, sans-serif" font-size="16">Same street, snowy weather</text>

  <path d="M500 266v59m-12-13 12 13 12-13" fill="none" stroke="#e9f5ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="38" y="341" width="924" height="166" rx="17" fill="#071e35" fill-opacity=".65" stroke="#b9e5ff" stroke-opacity=".68"/>
  <circle cx="58" cy="354" r="18" fill="#47a8d5"/><text x="58" y="361" text-anchor="middle" fill="#fff" font-family="system-ui, sans-serif" font-size="18" font-weight="700">D</text>
  <text x="85" y="373" fill="#f3f9ff" font-family="system-ui, sans-serif" font-size="20" font-weight="700">SMILE estimates which instruction words shaped the edit</text>
  <text x="85" y="400" fill="#cde3ee" font-family="system-ui, sans-serif" font-size="15">Change selected words, compare the resulting images, then fit a local explanation.</text>
  <g font-family="system-ui, sans-serif" font-size="18" text-anchor="middle">
    <rect x="84" y="420" width="185" height="48" rx="10" fill="#6a83a3"/><text x="176" y="450" fill="#fff">Make</text>
    <rect x="296" y="420" width="185" height="48" rx="10" fill="#6a83a3"/><text x="388" y="450" fill="#fff">the</text>
    <rect x="508" y="420" width="185" height="48" rx="10" fill="#d887a5"/><text x="600" y="450" fill="#102b47" font-weight="700">weather</text>
    <rect x="720" y="420" width="185" height="48" rx="10" fill="#f3afb0"/><text x="812" y="450" fill="#102b47" font-weight="700">snowy</text>
  </g>
  <text x="500" y="493" text-anchor="middle" fill="#d6e8f2" font-family="system-ui, sans-serif" font-size="13">Illustrative emphasis only · actual contributions depend on the model, image and comparison</text>
</svg>
